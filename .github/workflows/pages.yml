# SPDX-License-Identifier: AGPL-3.0-or-later
name: Deploy web reader

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, such as v0.5.0
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set published desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "v$version"
          assets=$(gh release view "$TAG" --json assets,isDraft --jq 'select(.isDraft == false) | .assets[].name')
          release="https://github.com/$GH_REPO/releases"
          echo "VITE_DESKTOP_RELEASE_URL=$release/tag/$TAG" >> "$GITHUB_ENV"
          add_download() {
            grep -Fxq "$2" <<< "$assets"
            echo "VITE_DOWNLOAD_$1=$release/download/$TAG/$2" >> "$GITHUB_ENV"
          }
          add_download WINDOWS "Pageglade-Setup-$version.exe"
          add_download WINDOWS_PORTABLE "Pageglade-Portable-$version.exe"
          add_download MAC_ARM64 "Pageglade-$version-arm64.dmg"
          add_download MAC_INTEL "Pageglade-$version-x64.dmg"
          add_download LINUX_APPIMAGE "Pageglade-$version-x86_64.AppImage"
          add_download LINUX_DEB "Pageglade-$version-amd64.deb"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release desktop installers
run-name: Release • ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.check.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify version and tag
        id: check
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/v$version"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$version"
          grep -Fx "export const VERSION = '$version'" src/version.ts
          echo "number=$version" >> "$GITHUB_OUTPUT"

  browser:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test

  desktop:
    needs: version
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            flags: --win --x64
            binary: release/win-unpacked/Pageglade.exe
            artifact: windows-x64
            files: Pageglade-Setup-{version}.exe Pageglade-Portable-{version}.exe
          - platform: Mac Apple chip
            runner: macos-15
            flags: --mac --arm64
            binary: release/mac-arm64/Pageglade.app/Contents/MacOS/Pageglade
            artifact: mac-arm64
            files: Pageglade-{version}-arm64.dmg
          - platform: Mac Intel
            runner: macos-15-intel
            flags: --mac --x64
            binary: release/mac/Pageglade.app/Contents/MacOS/Pageglade
            artifact: mac-x64
            files: Pageglade-{version}-x64.dmg
          - platform: Linux x64
            runner: ubuntu-22.04
            flags: --linux --x64
            binary: release/linux-unpacked/pageglade
            artifact: linux-x64
            files: Pageglade-{version}-x86_64.AppImage Pageglade-{version}-amd64.deb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec -- install-electron
      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          BUILD_FLAGS: ${{ matrix.flags }}
        run: npm run package:desktop -- $BUILD_FLAGS -c.electronDist=node_modules/electron/dist
      - name: Open an EPUB in the packaged app
        env:
          PAGEGLADE_DESKTOP_TEST: ${{ matrix.binary }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npm test -- desktop.spec.ts
          else
            npm test -- desktop.spec.ts
          fi
      - name: Stage expected installers
        env:
          FILES: ${{ matrix.files }}
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          mkdir installers
          for pattern in $FILES; do
            file="${pattern/\{version\}/$VERSION}"
            test -s "release/$file"
            cp "release/$file" installers/
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: installers/
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, browser, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: Publish GitHub Release
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          files=(
            "Pageglade-Setup-$VERSION.exe"
            "Pageglade-Portable-$VERSION.exe"
            "Pageglade-$VERSION-arm64.dmg"
            "Pageglade-$VERSION-x64.dmg"
            "Pageglade-$VERSION-x86_64.AppImage"
            "Pageglade-$VERSION-amd64.deb"
          )
          for file in "${files[@]}"; do test -s "$file"; done

          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft == false' | grep -qx true; then
            echo "The release is already published."
            exit 0
          fi

          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Pageglade is a calm, private EPUB reader. Open a book, scroll continuously or turn pages, and return to your saved place. Zoom using the reading controls, keyboard, wheel, or a supported pinch gesture.

          Choose the download for your computer.

          - **Windows x64:** Setup installs Pageglade. Portable runs without setup.
          - **Mac:** Choose arm64 for an Apple chip or x64 for an Intel processor.
          - **Linux x64:** Choose AppImage for a standalone file or .deb for Debian-based systems.

          These preview builds are distributed without publisher certificates. Windows and macOS may show security warnings. GitHub Actions built the packages and tested EPUB opening and exit in the packaged application on each runner.

          [Exact source and build instructions](https://github.com/$GH_REPO/tree/$GITHUB_SHA) · [Open-source notices](https://github.com/$GH_REPO/blob/$GITHUB_SHA/NOTICE.md) · [Contact Pageglade](https://tally.so/r/dbNeEK)
          EOF

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=()
            if [[ "$VERSION" == 0.* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag "${flags[@]}" \
              --title "Pageglade $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  web:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
